name: Verify and build debug APK
on:
  push:
    branches: [feat/pieljay-player-refresh]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: debug-apk-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android components
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Prepare generated sources
        env:
          DEEZER_CLIENT_ID: ${{ secrets.DEEZER_CLIENT_ID }}
          DEEZER_CLIENT_SECRET: ${{ secrets.DEEZER_CLIENT_SECRET }}
        run: sh tool/bootstrap.sh
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test Flutter
        run: flutter test
      - name: Test native byte ranges
        run: bash tool/test_native_ranges.sh
      - name: Test safe media diagnostics
        run: bash tool/test_media_responses.sh
      - name: Build ARM64 APK
        run: flutter build apk --debug --target-platform android-arm64 --split-per-abi
      - name: Test real offline HTTP server
        run: bash tool/test_offline_server.sh
      - name: Prepare artifact
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk artifacts/VYBE-MUSIC-0.8.5-arm64-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PiElJay-refreezer-debug-arm64
          path: artifacts/*.apk
          if-no-files-found: error
